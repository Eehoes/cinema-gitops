apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cinema

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend

          image: victory11942656/cinema-frontend:23

          imagePullPolicy: Always

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 200m
              memory: 256Mi


---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: cinema

spec:
  selector:
    app: frontend

  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080

  type: NodePort
